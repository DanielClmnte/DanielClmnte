<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#141a33"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#f472b6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.5 0;0.5 0;-0.5 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".7"/><stop offset="1" stop-color="#22d3ee" stop-opacity=".25"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".04"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="380" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <g filter="url(#blur)" opacity=".55">
      <circle r="160" fill="#a78bfa"><animate attributeName="cx" values="200;420;200" dur="14s" repeatCount="indefinite"/><animate attributeName="cy" values="80;260;80" dur="11s" repeatCount="indefinite"/></circle>
      <circle r="140" fill="#22d3ee"><animate attributeName="cx" values="1000;780;1000" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="300;100;300" dur="15s" repeatCount="indefinite"/></circle>
      <circle r="110" fill="#f472b6"><animate attributeName="cx" values="600;700;520;600" dur="16s" repeatCount="indefinite"/><animate attributeName="cy" values="380;300;360;380" dur="10s" repeatCount="indefinite"/></circle>
    </g>
    <rect width="1200" height="380" fill="url(#grid)"/>
    
      <text x="60" y="400" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="16" fill="#a78bfa" opacity="0">{ }
        <animate attributeName="y" values="400;-20" dur="9s" begin="0.0s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.35;0" dur="9s" begin="0.0s" repeatCount="indefinite"/>
      </text>
      <text x="157" y="400" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="20" fill="#22d3ee" opacity="0">&lt;/&gt;
        <animate attributeName="y" values="400;-20" dur="11s" begin="0.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.35;0" dur="11s" begin="0.8s" repeatCount="indefinite"/>
      </text>
      <text x="254" y="400" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="24" fill="#f472b6" opacity="0">fun
        <animate attributeName="y" values="400;-20" dur="13s" begin="1.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.35;0" dur="13s" begin="1.6s" repeatCount="indefinite"/>
      </text>
      <text x="351" y="400" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="16" fill="#a78bfa" opacity="0">=&gt;
        <animate attributeName="y" values="400;-20" dur="15s" begin="2.4000000000000004s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.35;0" dur="15s" begin="2.4000000000000004s" repeatCount="indefinite"/>
      </text>
      <text x="448" y="400" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="20" fill="#22d3ee" opacity="0">class
        <animate attributeName="y" values="400;-20" dur="9s" begin="3.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.35;0" dur="9s" begin="3.2s" repeatCount="indefinite"/>
      </text>
      <text x="545" y="400" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="24" fill="#f472b6" opacity="0">val
        <animate attributeName="y" values="400;-20" dur="11s" begin="4.0s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.35;0" dur="11s" begin="4.0s" repeatCount="indefinite"/>
      </text>
      <text x="642" y="400" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="16" fill="#a78bfa" opacity="0">#
        <animate attributeName="y" values="400;-20" dur="13s" begin="4.800000000000001s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.35;0" dur="13s" begin="4.800000000000001s" repeatCount="indefinite"/>
      </text>
      <text x="739" y="400" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="20" fill="#22d3ee" opacity="0">()
        <animate attributeName="y" values="400;-20" dur="15s" begin="5.6000000000000005s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.35;0" dur="15s" begin="5.6000000000000005s" repeatCount="indefinite"/>
      </text>
      <text x="836" y="400" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="24" fill="#f472b6" opacity="0">[ ]
        <animate attributeName="y" values="400;-20" dur="9s" begin="6.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.35;0" dur="9s" begin="6.4s" repeatCount="indefinite"/>
      </text>
      <text x="933" y="400" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="16" fill="#a78bfa" opacity="0">;
        <animate attributeName="y" values="400;-20" dur="11s" begin="7.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.35;0" dur="11s" begin="7.2s" repeatCount="indefinite"/>
      </text>
      <text x="1030" y="400" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="20" fill="#22d3ee" opacity="0">if
        <animate attributeName="y" values="400;-20" dur="13s" begin="8.0s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.35;0" dur="13s" begin="8.0s" repeatCount="indefinite"/>
      </text>
      <text x="1127" y="400" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="24" fill="#f472b6" opacity="0">&amp;&amp;
        <animate attributeName="y" values="400;-20" dur="15s" begin="8.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.35;0" dur="15s" begin="8.8s" repeatCount="indefinite"/>
      </text>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="1s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 20" to="0 0" dur="1s" fill="freeze"/>
      <text x="600.0" y="180" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="84" font-weight="800" fill="url(#brand)" letter-spacing="-1">Daniel Clemente</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="1s" begin=".6s" fill="freeze"/>
      <rect x="410.0" y="210" width="380" height="40" rx="20" fill="#ffffff" fill-opacity=".06" stroke="url(#border)"/>
      <text x="600.0" y="237" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#e2e8f0">🎓 Estudiante de DAM  ·  📍 Madrid</text>
    </g>
    
      <text x="600.0" y="292" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="22" fill="#cbd5e1" opacity="0">&gt; Aprendiendo algo nuevo cada día
        <animate attributeName="opacity" dur="10.5s" repeatCount="indefinite" begin="1.6s"
          keyTimes="0;0.000;0.020;0.313;0.333;1" values="0;0;1;1;0;0"/>
      </text>
      <text x="600.0" y="292" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="22" fill="#cbd5e1" opacity="0">&gt; Explorando el front, el back y el móvil
        <animate attributeName="opacity" dur="10.5s" repeatCount="indefinite" begin="1.6s"
          keyTimes="0;0.333;0.353;0.647;0.667;1" values="0;0;1;1;0;0"/>
      </text>
      <text x="600.0" y="292" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="22" fill="#cbd5e1" opacity="0">&gt; Convirtiendo café en código ☕
        <animate attributeName="opacity" dur="10.5s" repeatCount="indefinite" begin="1.6s"
          keyTimes="0;0.667;0.687;0.980;1.000;1" values="0;0;1;1;0;0"/>
      </text>
    <rect x="0" y="376" width="1200" height="4" fill="url(#brand)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="379" rx="24" fill="none" stroke="url(#border)"/>
</svg>
