<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="80" viewBox="0 0 1200 80">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#141a33"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#f472b6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.5 0;0.5 0;-0.5 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa" stop-opacity=".7"/><stop offset="1" stop-color="#22d3ee" stop-opacity=".25"/>
    </linearGradient></defs>
  <text x="600.0" y="44" text-anchor="middle" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#e2e8f0">📫  Contacto</text>
  <rect x="530.0" y="60" width="140" height="4" rx="2" fill="url(#brand)">
    <animate attributeName="width" values="0;140" dur="1s" fill="freeze"/>
    <animate attributeName="x" values="600.0;530.0" dur="1s" fill="freeze"/>
  </rect>
</svg>
